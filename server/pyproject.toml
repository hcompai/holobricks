[project]
name = "brickyard"
version = "0.1.0"
description = "Toolkit for an agent building Lego models from real LDraw parts"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "pillow>=12.3.0",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
brickyard-catalog = "brickyard.rebrickable:main"
brickyard-gallery = "brickyard.gallery:main"
brickyard-prices = "brickyard.pickabrick:main"
bricks = "brickyard.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
