[project]
name = "brickyard"
version = "0.1.0"
description = "Web shell for watching an agent build Lego models from real LDraw parts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pillow>=12.3.0",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
brickyard = "brickyard.app:main"
brickyard-gallery = "brickyard.gallery:main"
bricks = "brickyard.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
