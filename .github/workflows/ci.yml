name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ldraw
          key: ldraw-complete-v1
      - run: test -d ldraw || scripts/fetch-ldraw.sh
      - uses: actions/cache@v4
        with:
          path: shadow
          key: ldcad-shadow-9b1131fb1991f8c0bfc072325e4e12f6271aba35
      - run: python3 scripts/fetch-connectors.py
      - uses: astral-sh/setup-uv@v6
      - working-directory: server
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' web/package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run build
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - working-directory: web
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
          retention-days: 7
